controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    - Alternative
    goal_checker_plugins:
    - goal_checker
    - alternate_goal
    progress_checker_plugins:
    - progress_checker
    - alternate_progress
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      min_vel_x: 0.0
      max_vel_x: 0.4
      max_vel_theta: 1.0
      acc_lim_x: 1.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.0
      decel_lim_theta: -1.0
      vx_samples: 3
      vy_samples: 1
      vtheta_samples: 3
    Alternative:
      plugin: dwb_core::DWBLocalPlanner
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      min_vel_x: 0.0
      max_vel_x: 0.3
      max_vel_theta: 1.0
      acc_lim_x: 1.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.0
      decel_lim_theta: -1.0
      vx_samples: 3
      vy_samples: 1
      vtheta_samples: 3
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
    alternate_goal:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    alternate_progress:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.1
      robot_radius: 0.2
      plugins:
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
      update_frequency: 2.0
      publish_frequency: 1.0
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.5
    - 0.0
    - 2.5
    min_velocity:
    - -0.5
    - 0.0
    - -2.5
    max_accel:
    - 2.5
    - 0.0
    - 3.2
    max_decel:
    - -2.5
    - 0.0
    - -3.2
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
    odom_topic: /odom
    odom_duration: 0.1
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 1.0
    polygons:
    - StopPolygon
    StopPolygon:
      type: polygon
      points: '[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]'
      action_type: stop
      min_points: 1
      visualize: false
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan
      enabled: true
